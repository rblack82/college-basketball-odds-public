name: Test DraftKings Betting Splits

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect NCAA basketball market tables
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          from html import unescape
          from html.parser import HTMLParser
          from urllib.parse import urlencode

          BASE = "https://dknetwork.draftkings.com/draftkings-sportsbook-betting-splits/"
          SPORT = "92483"

          class Reader(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
                  self.rows = []
                  self.current = None
                  self.in_cell = False

              def handle_starttag(self, tag, attrs):
                  if tag == "tr":
                      self.current = []
                  if tag in ("td", "th"):
                      self.in_cell = True
                      self.parts = []

              def handle_data(self, data):
                  if self.in_cell:
                      self.parts.append(data)

              def handle_endtag(self, tag):
                  if tag in ("td", "th") and self.in_cell:
                      value = " ".join(" ".join(self.parts).split())
                      if self.current is not None:
                          self.current.append(value)
                      self.in_cell = False
                  if tag == "tr" and self.current is not None:
                      if self.current:
                          self.rows.append(self.current)
                      self.current = None

          for market in ["Moneyline", "Spread"]:
              print("\n" + "=" * 55)
              print("MARKET:", market)
              for period in ["today", "n7days"]:
                  params = {
                      "tb_eg": SPORT,
                      "tb_emt": market,
                      "tb_edate": period,
                      "itm_content": "NCAA Basketball"
                  }
                  url = BASE + "?" + urlencode(params)
                  print("\nDATE FILTER:", period)
                  print("URL:", url)
                  try:
                      request = urllib.request.Request(
                          url, headers={"User-Agent": "Mozilla/5.0"}
                      )
                      with urllib.request.urlopen(request, timeout=30) as response:
                          html = response.read().decode("utf-8", "replace")
                          print("HTTP:", response.status)
                      reader = Reader()
                      reader.feed(html)
                      print("HTML bytes:", len(html))
                      print("HTML table rows:", len(reader.rows))
                      for row in reader.rows[:12]:
                          print("ROW:", repr(row)[:500])

                      text = re.sub(
                          r"<(script|style)\b[^>]*>.*?</\1>",
                          " ", html, flags=re.I | re.S
                      )
                      text = unescape(re.sub(r"<[^>]+>", " ", text))
                      text = " ".join(text.split())

                      for term in ["Matchup", "Bets %", "Handle %",
                                   "No games", "No events", "Updated"]:
                          print(term, "occurrences:",
                                len(re.findall(re.escape(term), text, re.I)))

                      for term in ["Bets %", "Handle %"]:
                          hits = list(re.finditer(re.escape(term), text, re.I))
                          if hits:
                              hit = hits[-1]
                              print("LAST", term, "CONTEXT:",
                                    text[max(0,hit.start()-120):hit.end()+450])

                  except Exception as error:
                      print("ERROR:", repr(error))

          print("\nTest finished. Actual percentages must be verified.")
          PY
