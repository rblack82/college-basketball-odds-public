name: Test DraftKings Betting Splits

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Parse NCAA basketball betting splits
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          from html import unescape
          from html.parser import HTMLParser
          from urllib.parse import urlencode

          BASE = "https://dknetwork.draftkings.com/draftkings-sportsbook-betting-splits/"
          SPORT = "92483"

          class TextReader(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
                  self.skip = 0

              def handle_starttag(self, tag, attrs):
                  if tag in ("script", "style"):
                      self.skip += 1

              def handle_endtag(self, tag):
                  if tag in ("script", "style") and self.skip:
                      self.skip -= 1

              def handle_data(self, data):
                  if not self.skip:
                      value = " ".join(data.split())
                      if value:
                          self.parts.append(value)

          def download(market):
              params = {
                  "tb_eg": SPORT,
                  "tb_emt": market,
                  "tb_edate": "today",
                  "itm_content": "NCAA Basketball"
              }
              url = BASE + "?" + urlencode(params)
              request = urllib.request.Request(
                  url, headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  html = response.read().decode("utf-8", "replace")
              parser = TextReader()
              parser.feed(html)
              return unescape(" ".join(parser.parts))

          def extract(text, market):
              # Inspect the text around each market selection.
              # We only accept percentages immediately following
              # a recognizable market selection and odds.
              pattern = re.compile(
                  r"(?P<team>[A-Za-z][A-Za-z0-9 .&'()/-]{1,65}?)"
                  r"\s+(?P<line>[+−-]\d+(?:\.\d+)?)"
                  r"\s+(?P<price>[+−-]\d+)?"
                  r"\s+(?P<handle>\d{1,3})%"
                  r"\s+(?P<bets>\d{1,3})%",
                  re.I
              )
              records = []
              for match in pattern.finditer(text):
                  d = match.groupdict()
                  handle = int(d["handle"])
                  bets = int(d["bets"])
                  if handle > 100 or bets > 100:
                      continue
                  records.append({
                      "team": " ".join(d["team"].split()),
                      "line": d["line"],
                      "handle": handle,
                      "bets": bets,
                      "difference": handle - bets
                  })
              return records

          markets = {}
          for market in ("Moneyline", "Spread"):
              text = download(market)
              records = extract(text, market)
              markets[market] = records
              print("\nMARKET:", market)
              print("TEXT LENGTH:", len(text))
              print("CANDIDATE RECORDS:", len(records))
              for record in records[:20]:
                  print(record)
              print("FIRST TABLE CONTEXT:")
              marker = text.find("Selection Odds Handle Bets")
              if marker >= 0:
                  print(text[marker:marker+1100])
              else:
                  print("Table marker not found")

          print("\nCROSS-MARKET CANDIDATES")
          moneyline = {r["team"].lower(): r for r in markets["Moneyline"]}
          spread = {r["team"].lower(): r for r in markets["Spread"]}

          matched = set(moneyline) & set(spread)
          print("MATCHED TEAM NAMES:", len(matched))

          for team in sorted(matched):
              ml = moneyline[team]
              sp = spread[team]
              qualifies = ml["difference"] > 0 and sp["difference"] > 0
              print({
                  "team": ml["team"],
                  "ml_handle_minus_bets": ml["difference"],
                  "spread_handle_minus_bets": sp["difference"],
                  "stage2_candidate": qualifies
              })

          print("\nNOTE: Candidate records are not yet")
          print("validated against game boundaries or home/away.")
          PY
