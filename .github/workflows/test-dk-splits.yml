name: Test DraftKings Betting Splits

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test DraftKings Network access
        run: |
          python3 - <<'PY'
          import urllib.request
          import re

          url = "https://dknetwork.draftkings.com/draftkings-sportsbook-betting-splits/"

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  html = response.read().decode(
                      "utf-8", errors="replace"
                  )
                  print("HTTP status:", response.status)
                  print("Page size:", len(html))
          except Exception as error:
              print("Download failed:", error)
              raise

          for term in ["basketball", "moneyline", "handle", "spread"]:
              print(term, "found:", term in html.lower())

          print("Page title:")
          match = re.search(
              r"<title[^>]*>(.*?)</title>",
              html, re.I | re.S
          )
          print(match.group(1).strip() if match else "Not found")

          if len(html) < 1000:
              raise SystemExit("Response too small to be useful")
          PY
