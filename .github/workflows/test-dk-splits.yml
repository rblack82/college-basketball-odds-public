name: Test DraftKings Betting Splits

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect NCAA basketball splits
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          from html import unescape
          from html.parser import HTMLParser
          from urllib.parse import urlencode

          BASE = "https://dknetwork.draftkings.com/draftkings-sportsbook-betting-splits/"

          def get(params=None):
              url = BASE + ("?" + urlencode(params) if params else "")
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8", "replace")

          class Extract(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.text = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      self.links.append(dict(attrs))
              def handle_data(self, data):
                  value = data.strip()
                  if value:
                      self.text.append(value)

          html = get()
          parser = Extract()
          parser.feed(html)

          print("PAGE SIZE:", len(html))
          print("\nSPORT SELECTION LINKS")
          seen = set()
          for link in parser.links:
              href = unescape(link.get("href", ""))
              if "tb_eg=" in href and href not in seen:
                  seen.add(href)
                  print(href[:350])
          print("Total sport/table links:", len(seen))

          print("\nNCAA BASKETBALL CONTEXT")
          for term in ["NCAA Basketball", "College Basketball", "NCAAB"]:
              matches = list(re.finditer(re.escape(term), html, re.I))
              print(term, "occurrences:", len(matches))
              for m in matches[:3]:
                  print(re.sub(r"\s+", " ", html[max(0,m.start()-250):m.end()+350])[:650])

          print("\nSPORT IDENTIFIER CANDIDATES")
          ids = sorted(set(re.findall(r'tb_eg=(\d+)', html)))
          print(ids)

          print("\nMARKET PAGE CHECKS")
          # Only use sport IDs actually present in the page.
          for sport_id in ids[:12]:
              for market in ["Moneyline", "Spread"]:
                  params = {"tb_eg": sport_id, "tb_emt": market, "tb_edate": "today"}
                  try:
                      page = get(params)
                      p = Extract()
                      p.feed(page)
                      visible = re.sub(r"\s+", " ", " ".join(p.text))
                      print("\nSPORT:", sport_id, "MARKET:", market)
                      print("HTML size:", len(page))
                      for term in ["Matchup", "Bets %", "Handle %", "NCAA Basketball"]:
                          print(term, "count:", len(re.findall(re.escape(term), visible, re.I)))
                      match = re.search(r"Matchup", visible, re.I)
                      if match:
                          print("TABLE SAMPLE:", visible[match.start():match.start()+650])
                      else:
                          print("TEXT SAMPLE:", visible[:250])
                  except Exception as e:
                      print("ERROR:", str(e)[:200])

          print("\nTest complete. No betting data has been assumed.")
          PY
