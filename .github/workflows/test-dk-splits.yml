name: Test DraftKings Betting Splits

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Parse all NCAA basketball betting splits
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          from html import unescape
          from html.parser import HTMLParser
          from urllib.parse import urlencode

          BASE = "https://dknetwork.draftkings.com/draftkings-sportsbook-betting-splits/"
          SPORT = "92483"
          MAX_PAGES = 20

          class Reader(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
                  self.skip = 0

              def handle_starttag(self, tag, attrs):
                  if tag in ("script", "style"):
                      self.skip += 1

              def handle_endtag(self, tag):
                  if tag in ("script", "style") and self.skip:
                      self.skip -= 1

              def handle_data(self, data):
                  if not self.skip:
                      value = " ".join(data.split())
                      if value:
                          self.parts.append(value)

          def download(market, page):
              params = {
                  "tb_eg": SPORT,
                  "tb_emt": market,
                  "tb_edate": "today",
                  "itm_content": "NCAA Basketball",
                  "tb_page": page
              }
              request = urllib.request.Request(
                  BASE + "?" + urlencode(params),
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  html = response.read().decode("utf-8", "replace")
              reader = Reader()
              reader.feed(html)
              return unescape(" ".join(reader.parts))

          GAME = re.compile(
              r"(?P<away>[A-Za-z][A-Za-z0-9 .&'()/-]{1,65}?)"
              r"\s+@\s+"
              r"(?P<home>[A-Za-z][A-Za-z0-9 .&'()/-]{1,65}?)"
              r"\s+(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)"
              r"\s+\d{1,2}/\d{1,2}"
              r"\s+·\s+\d{1,2}:\d{2}"
              r"\s+(?:AM|PM)\s+ET",
              re.I
          )

          def clean_team(name):
              name = re.sub(
                  r"^(?:Advertisement\s+|AM ET\s+|PM ET\s+)+",
                  "", name.strip(), flags=re.I
              )
              return " ".join(name.split())

          def parse_page(text, market):
              matches = list(GAME.finditer(text))
              results = {}

              for index, match in enumerate(matches):
                  away = clean_team(match.group("away"))
                  home = clean_team(match.group("home"))

                  end = (
                      matches[index + 1].start()
                      if index + 1 < len(matches) else len(text)
                  )
                  block = text[match.end():end]
                  marker = "Selection Odds Handle Bets " + market
                  pos = block.find(marker)
                  if pos < 0:
                      continue

                  selection = block[pos + len(marker):].replace("−", "-")
                  selection = selection.split("Advertisement")[0]

                  if market == "Moneyline":
                      pattern = (
                          r"(?:^|\s)" + re.escape(home) +
                          r"\s+([+-]\d+)\s+"
                          r"(\d{1,3})%\s+(\d{1,3})%"
                      )
                  else:
                      pattern = (
                          r"(?:^|\s)" + re.escape(home) +
                          r"\s+([+-]\d+(?:\.\d+)?)\s+"
                          r"([+-]\d+)\s+"
                          r"(\d{1,3})%\s+(\d{1,3})%"
                      )

                  found = re.search(pattern, selection, re.I)
                  if not found:
                      continue

                  values = found.groups()
                  handle = int(values[-2])
                  bets = int(values[-1])

                  if handle > 100 or bets > 100:
                      continue

                  key = (away.lower(), home.lower())
                  results[key] = {
                      "away": away,
                      "home": home,
                      "line": values[0],
                      "handle": handle,
                      "bets": bets,
                      "difference": handle - bets
                  }

              return len(matches), results

          def collect(market):
              all_games = {}
              previous_keys = None

              for page in range(1, MAX_PAGES + 1):
                  text = download(market, page)
                  headings, games = parse_page(text, market)
                  keys = frozenset(games)

                  print(
                      market, "PAGE", page,
                      "headings:", headings,
                      "parsed:", len(games),
                      "new:", len(set(games) - set(all_games))
                  )

                  if not headings or not games:
                      break
                  if keys == previous_keys:
                      print("Repeated page detected; stopping.")
                      break

                  all_games.update(games)
                  previous_keys = keys

                  if not (set(games) - (set(all_games) - set(games))):
                      pass

              print(market, "TOTAL UNIQUE GAMES:", len(all_games))
              return all_games

          moneyline = collect("Moneyline")
          spread = collect("Spread")

          common = sorted(set(moneyline) & set(spread))
          print("\nMATCHED GAMES:", len(common))

          passing = []
          for key in common:
              ml = moneyline[key]
              sp = spread[key]
              passes = ml["difference"] > 0 and sp["difference"] > 0
              result = {
                  "game": ml["away"] + " @ " + ml["home"],
                  "moneyline_handle": ml["handle"],
                  "moneyline_bets": ml["bets"],
                  "spread_handle": sp["handle"],
                  "spread_bets": sp["bets"],
                  "moneyline_difference": ml["difference"],
                  "spread_difference": sp["difference"],
                  "passes_splits_only": passes
              }
              print(result)
              if passes:
                  passing.append(result)

          print("\nSTAGE 2 SPLITS-ONLY PASSING:", len(passing))
          for result in passing:
              print("PASS:", result["game"])

          print("\nUNMATCHED MONEYLINE:", len(set(moneyline) - set(spread)))
          for key in sorted(set(moneyline) - set(spread))[:10]:
              print("ML ONLY:", moneyline[key]["away"], "@", moneyline[key]["home"])

          print("\nUNMATCHED SPREAD:", len(set(spread) - set(moneyline)))
          for key in sorted(set(spread) - set(moneyline))[:10]:
              print("SPREAD ONLY:", spread[key]["away"], "@", spread[key]["home"])

          print("\nDiagnostic test only. Not final betting picks.")
          PY
