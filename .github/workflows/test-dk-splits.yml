name: Test DraftKings Betting Splits

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Download and inspect betting splits
        run: |
          python3 - <<'PY'
          import urllib.request
          import re
          import json
          from html import unescape
          from html.parser import HTMLParser

          URL = "https://dknetwork.draftkings.com/draftkings-sportsbook-betting-splits/"

          req = urllib.request.Request(
              URL,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              html = response.read().decode("utf-8", "replace")
              print("HTTP:", response.status)
              print("Downloaded bytes:", len(html))

          class ScriptParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.scripts = []
                  self.current = None

              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.current = {
                          "attrs": dict(attrs),
                          "text": ""
                      }

              def handle_data(self, data):
                  if self.current is not None:
                      self.current["text"] += data

              def handle_endtag(self, tag):
                  if tag == "script" and self.current is not None:
                      self.scripts.append(self.current)
                      self.current = None

          parser = ScriptParser()
          parser.feed(html)

          print("Script elements:", len(parser.scripts))

          keywords = [
              "ncaa", "ncaab", "college basketball",
              "moneyline", "handle", "spread",
              "bet percentage", "betting splits"
          ]

          print("\nEmbedded script candidates:")
          found = 0
          for i, script in enumerate(parser.scripts):
              content = unescape(script["text"])
              matches = [
                  word for word in keywords
                  if word in content.lower()
              ]
              if len(matches) >= 3:
                  found += 1
                  print(
                      "Script", i,
                      "length", len(content),
                      "keywords", matches
                  )
                  print("Preview:", content[:500].replace("\n", " "))

          print("Candidate scripts:", found)

          print("\nHTML data markers:")
          for marker in [
              "__NEXT_DATA__", "application/ld+json",
              "application/json", "iframe",
              "data-testid", "moneyline", "handle"
          ]:
              print(marker, html.lower().count(marker.lower()))

          print("\nRelevant iframe URLs:")
          for src in re.findall(
              r'<iframe[^>]+src=["\']([^"\']+)',
              html, re.I
          ):
              print(unescape(src)[:300])

          print("\nVisible text samples:")
          clean = re.sub(
              r"<(script|style)\b[^>]*>.*?</\1>",
              " ", html, flags=re.I | re.S
          )
          clean = re.sub(r"<[^>]+>", " ", clean)
          clean = unescape(clean)
          clean = re.sub(r"\s+", " ", clean)
          for term in ["NCAA", "College Basketball", "Moneyline", "Handle"]:
              match = re.search(re.escape(term), clean, re.I)
              if match:
                  print(term, ":", clean[max(0,match.start()-100):match.start()+250])

          print("\nInspection complete; extraction not yet verified.")
          PY
