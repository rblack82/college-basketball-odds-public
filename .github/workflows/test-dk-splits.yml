name: Test DraftKings Betting Splits

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Parse NCAA basketball games
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          from html import unescape
          from html.parser import HTMLParser
          from urllib.parse import urlencode

          BASE = "https://dknetwork.draftkings.com/draftkings-sportsbook-betting-splits/"
          SPORT = "92483"

          class Reader(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
                  self.skip = 0

              def handle_starttag(self, tag, attrs):
                  if tag in ("script", "style"):
                      self.skip += 1

              def handle_endtag(self, tag):
                  if tag in ("script", "style") and self.skip:
                      self.skip -= 1

              def handle_data(self, data):
                  if not self.skip:
                      value = " ".join(data.split())
                      if value:
                          self.parts.append(value)

          def download(market):
              params = {
                  "tb_eg": SPORT,
                  "tb_emt": market,
                  "tb_edate": "today",
                  "itm_content": "NCAA Basketball"
              }
              request = urllib.request.Request(
                  BASE + "?" + urlencode(params),
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  html = response.read().decode("utf-8", "replace")
              parser = Reader()
              parser.feed(html)
              return unescape(" ".join(parser.parts))

          # Matchups have a visible away @ home heading,
          # followed by a date and market selection rows.
          GAME = re.compile(
              r"(?P<away>[A-Za-z][A-Za-z0-9 .&'()/-]{1,55}?)"
              r"\s+@\s+"
              r"(?P<home>[A-Za-z][A-Za-z0-9 .&'()/-]{1,55}?)"
              r"\s+(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)"
              r"\s+\d{1,2}/\d{1,2}"
              r"\s+·\s+\d{1,2}:\d{2}"
              r"\s+(?:AM|PM)\s+ET",
              re.I
          )

          def extract(market):
              text = download(market)
              matches = list(GAME.finditer(text))
              results = {}

              for index, match in enumerate(matches):
                  away = match.group("away").strip()
                  home = match.group("home").strip()
                  end = matches[index+1].start() if index+1 < len(matches) else len(text)
                  block = text[match.end():end]

                  header = "Selection Odds Handle Bets " + market
                  start = block.find(header)
                  if start < 0:
                      continue

                  selection = block[start+len(header):]
                  selection = selection.split("Advertisement")[0]

                  # Normalize Unicode minus for parsing.
                  selection = selection.replace("−", "-")

                  # Capture home-team selection specifically.
                  escaped = re.escape(home)
                  if market == "Moneyline":
                      pattern = (
                          r"(?:^|\s)" + escaped +
                          r"\s+([+-]\d+)\s+(\d{1,3})%\s+(\d{1,3})%"
                      )
                  else:
                      pattern = (
                          r"(?:^|\s)" + escaped +
                          r"\s+([+-]\d+(?:\.\d+)?)"
                          r"\s+([+-]\d+)"
                          r"\s+(\d{1,3})%\s+(\d{1,3})%"
                      )

                  found = re.search(pattern, selection, re.I)
                  if not found:
                      continue

                  groups = found.groups()
                  handle = int(groups[-2])
                  bets = int(groups[-1])
                  if handle > 100 or bets > 100:
                      continue

                  key = (away.lower(), home.lower())
                  results[key] = {
                      "away": away,
                      "home": home,
                      "line": groups[0],
                      "handle": handle,
                      "bets": bets,
                      "difference": handle - bets
                  }

              print("\nMARKET:", market)
              print("MATCHUP HEADINGS:", len(matches))
              print("HOME RECORDS PARSED:", len(results))
              for item in list(results.values())[:12]:
                  print(item)

              if not results and matches:
                  first = matches[0]
                  print("DEBUG FIRST MATCHUP:", first.groupdict())
                  print("DEBUG FIRST BLOCK:", text[first.end():first.end()+450])

              return results

          moneyline = extract("Moneyline")
          spread = extract("Spread")

          print("\nCROSS-MARKET HOME TEAM RESULTS")
          common = sorted(set(moneyline) & set(spread))
          print("MATCHED GAMES:", len(common))

          passing = []
          for key in common:
              ml = moneyline[key]
              sp = spread[key]
              qualifies = (
                  ml["difference"] > 0 and
                  sp["difference"] > 0
              )
              # Final model also requires home-favorite
              # status and Stage 1 line movement.
              result = {
                  "game": ml["away"] + " @ " + ml["home"],
                  "ml_difference": ml["difference"],
                  "spread_difference": sp["difference"],
                  "passes_splits_only": qualifies
              }
              print(result)
              if qualifies:
                  passing.append(result)

          print("\nSPLITS-ONLY PASSING GAMES:", len(passing))
          print("Not final betting picks.")
          PY
