name: Test DraftKings Betting Splits

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Find DraftKings data sources
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          from html import unescape
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse

          URL = "https://dknetwork.draftkings.com/draftkings-sportsbook-betting-splits/"

          def download(url):
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(request, timeout=25) as response:
                  return response.read().decode("utf-8", "replace")

          html = download(URL)
          print("Page downloaded:", len(html), "characters")

          class Finder(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.scripts = []
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "script" and attrs.get("src"):
                      self.scripts.append(urljoin(URL, attrs["src"]))
                  if tag == "link" and attrs.get("href"):
                      self.links.append(urljoin(URL, attrs["href"]))

          parser = Finder()
          parser.feed(html)

          print("\nEXTERNAL JAVASCRIPT FILES")
          for i, url in enumerate(parser.scripts):
              print(i, url[:250])

          print("\nPOTENTIAL DATA REFERENCES IN HTML")
          patterns = [
              r'https?[^\s"<>]{0,180}(?:api|splits|odds|betting)[^\s"<>]{0,180}',
              r'[^\s"<>]{0,100}(?:\.json|graphql|wp-json)[^\s"<>]{0,120}',
          ]
          matches = set()
          for pattern in patterns:
              for item in re.findall(pattern, html, re.I):
                  matches.add(unescape(item).replace("\\/", "/"))

          for item in sorted(matches)[:35]:
              print(item[:250])

          print("\nCHECKING RELEVANT JAVASCRIPT")
          checked = 0
          for url in parser.scripts:
              if checked >= 12:
                  break
              host = urlparse(url).hostname or ""
              if not (
                  host.endswith("draftkings.com")
                  or host.endswith("voxmedia.com")
                  or host.endswith("sbnation.com")
              ):
                  continue

              checked += 1
              try:
                  js = download(url)
                  terms = [
                      term for term in [
                          "bettingSplits", "betting-splits",
                          "handlePercentage", "moneyline",
                          "graphql", "fetch(", "axios"
                      ]
                      if term.lower() in js.lower()
                  ]
                  print(
                      "FILE:", url[:180],
                      "SIZE:", len(js),
                      "MATCHES:", terms
                  )
                  for term in ["bettingSplits", "handlePercentage", "graphql"]:
                      match = re.search(re.escape(term), js, re.I)
                      if match:
                          print(
                              "CONTEXT:",
                              js[max(0, match.start()-120):match.end()+180]
                          )
              except Exception as error:
                  print("FILE ERROR:", str(error)[:160])

          print("\nJavaScript files checked:", checked)
          print("Investigation complete.")
          PY
