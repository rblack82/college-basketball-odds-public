name: Collect DraftKings Betting Splits

on:
  workflow_dispatch:
  schedule:
    - cron: '15 15 * * *'
    - cron: '15 16 * * *'
    - cron: '45 18 * * *'
    - cron: '45 19 * * *'
permissions:
  contents: write

concurrency:
  group: collect-dk-splits
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Central time
        id: timing
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("America/Chicago"))
          minutes = now.hour * 60 + now.minute
          
          # Accept scheduled runs delayed by up to 45 minutes.
          morning = 10 * 60 + 15 <= minutes <= 11 * 60
          afternoon = 13 * 60 + 45 <= minutes <= 14 * 60 + 30

          should_run = (
              os.environ["EVENT_NAME"] == "workflow_dispatch"
              or morning
              or afternoon
          )

          print("Central time:", now.isoformat())
          print("Collect splits:", should_run)

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(
                  "run=" + str(should_run).lower() + "\n"
              )
          PY

      - name: Collect and save splits
        if: steps.timing.outputs.run == 'true'
        run: |
          python3 - <<'PY'
          import json
          import re
          import urllib.request
          from datetime import datetime
          from html import unescape
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlencode
          from zoneinfo import ZoneInfo

          BASE = "https://dknetwork.draftkings.com/draftkings-sportsbook-betting-splits/"
          SPORT = "92483"
          MAX_PAGES = 30

          class Reader(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
                  self.skip = 0

              def handle_starttag(self, tag, attrs):
                  if tag in ("script", "style"):
                      self.skip += 1

              def handle_endtag(self, tag):
                  if tag in ("script", "style") and self.skip:
                      self.skip -= 1

              def handle_data(self, data):
                  if not self.skip:
                      value = " ".join(data.split())
                      if value:
                          self.parts.append(value)

          def download(market, page):
              params = {
                  "tb_eg": SPORT,
                  "tb_emt": market,
                  "tb_edate": "today",
                  "itm_content": "NCAA Basketball",
                  "tb_page": page
              }
              request = urllib.request.Request(
                  BASE + "?" + urlencode(params),
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  html = response.read().decode("utf-8", "replace")
              reader = Reader()
              reader.feed(html)
              return unescape(" ".join(reader.parts))

          GAME = re.compile(
              r"(?P<away>[A-Za-z][A-Za-z0-9 .&'()/-]{1,65}?)"
              r"\s+@\s+"
              r"(?P<home>[A-Za-z][A-Za-z0-9 .&'()/-]{1,65}?)"
              r"\s+(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)"
              r"\s+\d{1,2}/\d{1,2}"
              r"\s+·\s+\d{1,2}:\d{2}"
              r"\s+(?:AM|PM)\s+ET",
              re.I
          )

          def clean(name):
              name = name.strip()
              name = re.sub(
                  r"^(?:(?:Advertisement|AM ET|PM ET)\s+)+",
                  "", name, flags=re.I
              )
              return " ".join(name.split())

          def parse(text, market):
              matches = list(GAME.finditer(text))
              games = {}

              for i, match in enumerate(matches):
                  away = clean(match.group("away"))
                  home = clean(match.group("home"))
                  end = matches[i+1].start() if i+1 < len(matches) else len(text)
                  block = text[match.end():end]
                  marker = "Selection Odds Handle Bets " + market
                  position = block.find(marker)
                  if position < 0:
                      continue

                  selection = block[position+len(marker):]
                  selection = selection.replace("−", "-")
                  selection = selection.split("Advertisement")[0]

                  if market == "Moneyline":
                      expression = (
                          r"(?:^|\s)" + re.escape(home) +
                          r"\s+([+-]\d+)\s+"
                          r"(\d{1,3})%\s+(\d{1,3})%"
                      )
                  else:
                      expression = (
                          r"(?:^|\s)" + re.escape(home) +
                          r"\s+([+-]\d+(?:\.\d+)?)\s+"
                          r"([+-]\d+)\s+"
                          r"(\d{1,3})%\s+(\d{1,3})%"
                      )

                  found = re.search(expression, selection, re.I)
                  if not found:
                      continue

                  groups = found.groups()
                  handle, bets = int(groups[-2]), int(groups[-1])
                  if handle > 100 or bets > 100:
                      continue

                  key = (away.casefold(), home.casefold())
                  games[key] = {
                      "away": away,
                      "home": home,
                      "line": groups[0],
                      "handle_pct": handle,
                      "bets_pct": bets,
                      "difference": handle - bets
                  }

              return games

          def collect(market):
              all_games = {}
              previous = None
              for page in range(1, MAX_PAGES+1):
                  games = parse(download(market, page), market)
                  keys = frozenset(games)
                  if not games or keys == previous:
                      break
                  new_count = len(keys - set(all_games))
                  print(market, "page", page,
                        "games", len(games), "new", new_count)
                  if new_count == 0:
                      break
                  all_games.update(games)
                  previous = keys
              else:
                  raise RuntimeError("Pagination limit reached: " + market)
              print(market, "total", len(all_games))
              return all_games

          ml = collect("Moneyline")
          sp = collect("Spread")

          if not ml and not sp:
              raise RuntimeError("No betting splits collected")

          now = datetime.now(ZoneInfo("America/Chicago"))
          date = now.strftime("%Y-%m-%d")
          stamp = now.strftime("%H%M%S")
          folder = Path("dk-splits") / date
          folder.mkdir(parents=True, exist_ok=True)

          records = []
          for key in sorted(set(ml) | set(sp)):
              moneyline = ml.get(key)
              spread = sp.get(key)

              if moneyline is None or spread is None:
                  status = "PENDING"
              elif moneyline["difference"] > 0 and spread["difference"] > 0:
                  status = "PASS"
              else:
                  status = "FAIL"

              source = moneyline or spread
              records.append({
                  "away": source["away"],
                  "home": source["home"],
                  "moneyline": moneyline,
                  "spread": spread,
                  "status": status
              })

          output = {
              "collected_at_central": now.isoformat(),
              "source": BASE,
              "sport_id": SPORT,
              "moneyline_games": len(ml),
              "spread_games": len(sp),
              "games": records
          }

          path = folder / ("splits-" + stamp + ".json")
          path.write_text(json.dumps(output, indent=2) + "\n")
          print("Saved:", path)
          for status in ("PASS", "FAIL", "PENDING"):
              count = sum(r["status"] == status for r in records)
              print(status, count)
          PY

      - name: Commit results
        if: steps.timing.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dk-splits/
          if ! git diff --cached --quiet; then
            git commit -m "Collect DraftKings NCAA betting splits"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No new changes"
          fi
