name: Diagnose Greg spreadsheet freshness (read-only)

on:
  push:
    paths:
      - .github/workflows/diagnose-greg-freshness.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare live Google CSV with last published copy
        run: |
          python3 - <<'PY'
          import csv, io, pathlib, hashlib, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo
          url="https://docs.google.com/spreadsheets/d/1WcpH4nYnwXRLEWz8VCgVsVkzu2Y4-wueb1zGZf1KOlM/export?format=csv"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=30) as r:
              data=r.read()
              print("SOURCE_HTTP_STATUS",r.status)
          rows=list(csv.reader(io.StringIO(data.decode("utf-8-sig"))))
          today=datetime.now(ZoneInfo("America/Chicago")).strftime("%Y-%m-%d")
          previous=sorted(pathlib.Path("greg-lines").glob("*/lines.csv"))
          print("TODAY_CENTRAL",today)
          print("ROW_COUNT",len(rows))
          print("HEADERS", rows[0][:6] if rows else [])
          print("FIRST_GAMES", [r[1:3] for r in rows[1:7] if len(r)>=3])
          print("SOURCE_SHA256",hashlib.sha256(data).hexdigest()[:20])
          if previous:
              recent=previous[-1]
              old=recent.read_bytes()
              print("LATEST_PUBLISHED",recent)
              print("LATEST_SHA256",hashlib.sha256(old).hexdigest()[:20])
              print("SOURCE_IDENTICAL_TO_LATEST",data==old)
          print("No file saved in diagnostic.")
          PY
