name: Collect Greg Peterson Lines

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/test-greg-sheet.yml
  schedule:
    - cron: '30 14 * * *'
    - cron: '30 15 * * *'

permissions:
  contents: write

concurrency:
  group: greg-lines-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and validate spreadsheet
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import csv
          import datetime
          import io
          import os
          import pathlib
          import urllib.request
          from zoneinfo import ZoneInfo

          now = datetime.datetime.now(ZoneInfo("America/Chicago"))

          if os.environ["EVENT_NAME"] == "schedule":
              minutes = now.hour * 60 + now.minute
              earliest = 8 * 60 + 15
              latest = 11 * 60 + 45

              if not (earliest <= minutes <= latest):
                  print("Outside scheduled collection window")
                  raise SystemExit(0)

          today = now.strftime("%Y-%m-%d")
          output = pathlib.Path("greg-lines") / today / "lines.csv"

          if output.exists():
              print("Today's spreadsheet already collected")
              raise SystemExit(0)

          url = (
              "https://docs.google.com/spreadsheets/d/"
              "1WcpH4nYnwXRLEWz8VCgVsVkzu2Y4-wueb1zGZf1KOlM/"
              "export?format=csv"
          )

          request = urllib.request.Request(
              url, headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = response.read()

          rows = list(csv.reader(io.StringIO(
              data.decode("utf-8-sig")
          )))

          if len(rows) < 10 or not any(
              "Greg's Line" in cell for cell in rows[0]
          ):
              raise SystemExit("Invalid spreadsheet data")

          # The shared Google URL may still serve yesterday's board in the morning.
          # Compare the game lines, not just the bytes, before stamping a new day.
          import re
          def board(records):
              entries = set()
              for row in records[1:]:
                  for start in range(0, len(row)-2, 3):
                      if re.fullmatch(r"\d{3,6}", row[start].strip()) and row[start+1].strip():
                          try:
                              number = float(row[start+2].strip())
                          except ValueError:
                              continue
                          entries.add((row[start].strip(), row[start+1].strip(), number))
              return entries

          current_board = board(rows)
          if len(current_board) < 20:
              raise SystemExit("Too few valid games in Greg's spreadsheet; refusing to publish")
          earlier = sorted(pathlib.Path("greg-lines").glob("*/lines.csv"))
          earlier = [p for p in earlier if p.parent.name < today]
          if earlier:
              previous_rows = list(csv.reader(io.StringIO(earlier[-1].read_text(encoding="utf-8-sig"))))
              if current_board == board(previous_rows):
                  print("Greg's source still has the previous day's board; not stamping stale lines as today's")
                  raise SystemExit(0)

          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_bytes(data)
          print(f"Saved {output}: {len(rows)} rows")
          print("WARNING: Daily freshness not independently verified")
          PY

      - name: Publish CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add greg-lines/
          if ! git diff --cached --quiet; then
            git commit -m "Collect Greg Peterson daily lines"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
